services:
  - type: web
    name: urbanquest-ai
    runtime: python
    rootDir: urbanquest-ai
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: MAPS_PROVIDER
        value: demo
      - key: MAX_CANDIDATES
        value: "8"
      - key: CORS_ORIGINS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: AUTH_FROM_EMAIL
        sync: false
      - key: ENVIRONMENT
        value: production
